name: Bug report
description: Something in skitterspec behaves differently from what a skill or the docs say.
labels: [triage, bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and the steps that led there.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: skitterspec and provider versions, OS, Node, and the skill involved. `skitterspec report-issue` fills this in.
