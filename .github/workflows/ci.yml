# Run the test suite on every push and pull request.
#
# The matrix floor is not a free choice: `engines.node` and the lowest version
# here are asserted equal by `scripts/workflows.test.js`, so a floor nobody
# tests cannot quietly appear in the manifests.
#
# The suite needs a real install. Tests require workspace packages by NAME
# (`@skitterbyte/skitterspec-common/…`, `@skitterbyte/skitterspec-sync-core`),
# which resolve only through the `node_modules/@skitterbyte/*` symlinks pnpm
# creates — on a bare checkout the runner discovers 1825 tests instead of 2362
# and fails 41. So there is no no-install job here.
#
# The floor is >= 22.13 because 22 (Jod) is the oldest Node line still receiving
# fixes, and because the lowest job in this matrix tests it. It is NOT pnpm's
# requirement: pnpm 12 is a native binary that does not run on your Node at all
# and declares `>=18.*`. pnpm 11.11 did require >= 22.13, and that was the
# original justification — see feat-toolchain-pnpm-12.
#
# NOTE: `actions/setup-node` is used WITHOUT `registry-url`, here as in
# release.yml. That option writes an `.npmrc` containing an `_authToken`, and
# release.yml's OIDC exchange only happens when npm finds no credentials at all.
# Keeping both workflows identical on this point is what stops it being copied
# across later.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v7

      # No version pinned: action-setup reads `packageManager` from the root
      # package.json, so the lockfile and CI can never disagree about pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The same git-backed tests again, with the project in a subfolder of its
      # git root (spec feat-subfolder-project).
      - run: pnpm test:nested

  # A subfolder project's first adopter is on Windows, where git prints `/` and
  # `path` builds `\` — exactly the bug class nesting a project creates, and
  # nothing on ubuntu would catch it.
  #
  # Both runs gate, as on ubuntu (chore-windows-ci made the full suite green
  # here). A test that cannot apply on Windows skips itself with a reason —
  # never this job.
  windows:
    name: windows (node 24)
    runs-on: windows-latest
    env:
      ANNOTATE: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/gh-annotations.js --test-reporter-destination=stdout
    steps:
      # Before checkout: a worktree path under the runner's temp dir plus a
      # deep spec folder can pass MAX_PATH.
      - run: git config --global core.longpaths true

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Each failure also becomes a public annotation (scripts/gh-annotations.js):
      # the log needs repo-admin rights to download, the annotations do not.
      - run: pnpm test:nested ${{ env.ANNOTATE }}
      - run: pnpm test ${{ env.ANNOTATE }}
